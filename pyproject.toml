[project]
name = "sigbot"
version = "0.1.0"
description = "Trading system for the SIG Predictions Cup (2026 Midterms)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sigbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
